name: Build facade print package

on:
  workflow_dispatch:
    inputs:
      asset_archive_url:
        description: Optional direct URL to luba_facade_source_asset_q85.zip
        required: false
        type: string
  push:
    paths:
      - "facade-print/**"
      - ".github/workflows/facade-print.yml"
  pull_request:
    paths:
      - "facade-print/**"
      - ".github/workflows/facade-print.yml"

jobs:
  validate-and-generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: facade-print
    env:
      ASSET_ARCHIVE_URL: ${{ inputs.asset_archive_url || vars.FACADE_ASSET_ARCHIVE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: facade-print/requirements.lock
      - name: Install native rendering libraries
        run: sudo apt-get update && sudo apt-get install -y libcairo2
      - name: Install pinned Python dependencies
        run: pip install -r requirements.lock
      - name: Validate code and fixed geometry
        run: python scripts/validate_project.py --config config.json
        
      - name: Prepare verified realistic source asset
        id: asset
        shell: bash
        run: |
          set -euo pipefail

          ASSET="assets/wall_artwork_realistic_75dpi.webp"
          LOCAL_ARCHIVE="assets/luba_facade_source_asset_q85.zip"

          if [[ -f "$ASSET" ]]; then
            python scripts/bootstrap_asset.py --verify-only
          elif [[ -f "$LOCAL_ARCHIVE" ]]; then
            python scripts/bootstrap_asset.py --archive "$LOCAL_ARCHIVE"
          else
            echo "Missing source archive: $LOCAL_ARCHIVE"
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          
      - name: Generate all print files
        if: steps.asset.outputs.available == 'true'
        run: |
          mkdir -p generated
          set -o pipefail
          python scripts/generate_print_package_v2.py --config config.json --output generated 2>&1 | tee generated/build.log
      - name: Verify generated package
        if: steps.asset.outputs.available == 'true'
        run: python scripts/validate_project.py --config config.json --require-asset --generated generated
      - name: Upload print package and diagnostics
        if: steps.asset.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: luba-garage-facade-print
          path: |
            facade-print/generated/*.pdf
            facade-print/generated/*.svg
            facade-print/generated/*.jpg
            facade-print/generated/*.png
            facade-print/generated/*.txt
            facade-print/generated/build.log
          if-no-files-found: error
          retention-days: 90
