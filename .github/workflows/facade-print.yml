name: Build facade print package

on:
  workflow_dispatch:
  push:
    paths:
      - "facade-print/**"
      - ".github/workflows/facade-print.yml"

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: facade-print
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: facade-print/requirements.txt
      - name: Install native rendering libraries
        run: sudo apt-get update && sudo apt-get install -y libcairo2
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Generate all print files
        run: python scripts/generate_print_package.py --config config.json --output generated
      - name: Upload print package
        uses: actions/upload-artifact@v4
        with:
          name: luba-garage-facade-print
          path: |
            facade-print/generated/*.pdf
            facade-print/generated/*.svg
            facade-print/generated/*.jpg
            facade-print/generated/*.png
            facade-print/generated/*.txt
          if-no-files-found: error
          retention-days: 90
