<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050">

<style>
  .solid { stroke:#111; stroke-width:2; fill:#f5f5f5; }
  .roof { stroke:#111; stroke-width:2; fill:#e8e8e8; }
  .tower { stroke:#111; stroke-width:2; fill:#f0f0f0; }
  .dash { stroke:#444; stroke-width:1.5; fill:none; stroke-dasharray:7 5; }
  .dim { stroke:#111; stroke-width:1.2; fill:none; marker-start:url(#arrow); marker-end:url(#arrow); }
  .ext { stroke:#777; stroke-width:1; fill:none; }
  .txt { font-family:Arial, sans-serif; font-size:18px; fill:#111; }
  .small { font-family:Arial, sans-serif; font-size:14px; fill:#111; }
  .title { font-family:Arial, sans-serif; font-size:24px; font-weight:700; fill:#111; }
  .note { font-family:Arial, sans-serif; font-size:13px; fill:#333; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#111" />
  </marker>
</defs>

<rect x="0" y="0" width="1500" height="1050" fill="white"/>
<text class="title" x="40" y="45">Luba 3 AWD garage — lower box + hinged gable roof, exact proportions</text>
<text class="note" x="40" y="72">Lower box 1050 × 760 × 470 mm; roof footprint 1090 × 820 mm; ridge rise 300 mm; total without tower 770 mm.</text>
<text class="txt" x="100" y="120">Front view</text>
<rect class="solid" x="100" y="501.5" width="418.00000000000006" height="258.5"/>
<polygon class="roof" points="83.5,501.5 309.0,336.5 534.5,501.5"/>
<line class="dim" x1="100" y1="805" x2="518.0" y2="805"/><text class="small" x="309.0" y="797" text-anchor="middle">box 760 mm</text>
<line class="dim" x1="83.5" y1="486.5" x2="534.5" y2="486.5"/><text class="small" x="309.0" y="476.5" text-anchor="middle">roof 820 mm</text>
<line class="dim" x1="588.0" y1="501.5" x2="588.0" y2="760"/><text class="small" x="600.0" y="630.75" text-anchor="start" dominant-baseline="middle">box 470 mm</text>
<line class="dim" x1="648.0" y1="336.5" x2="648.0" y2="760"/><text class="small" x="660.0" y="548.25" text-anchor="start" dominant-baseline="middle">total 770 mm</text>
<line class="dim" x1="574.5" y1="336.5" x2="574.5" y2="501.5"/><text class="small" x="586.5" y="419.0" text-anchor="start" dominant-baseline="middle">rise 300 mm</text>
<text class="small" x="309.0" y="321.5" text-anchor="middle">ridge</text>
<text class="txt" x="680" y="120">Side view / roof length</text>
<rect class="solid" x="680" y="501.5" width="577.5" height="258.5"/>
<rect class="roof" x="669.0" y="336.5" width="599.5" height="165.0" opacity="0.75"/>
<line class="ext" x1="669.0" y1="501.5" x2="1268.5" y2="501.5"/>
<line class="dim" x1="680" y1="805" x2="1257.5" y2="805"/><text class="small" x="968.75" y="797" text-anchor="middle">box 1050 mm</text>
<line class="dim" x1="669.0" y1="311.5" x2="1268.5" y2="311.5"/><text class="small" x="968.75" y="303.5" text-anchor="middle">roof 1090 mm</text>
<line class="dim" x1="1322.5" y1="501.5" x2="1322.5" y2="760"/><text class="small" x="1334.5" y="630.75" text-anchor="start" dominant-baseline="middle">470 mm</text>
<line class="dim" x1="1323.5" y1="336.5" x2="1323.5" y2="501.5"/><text class="small" x="1335.5" y="419.0" text-anchor="start" dominant-baseline="middle">rise 300 mm</text>
<text class="note" x="680" y="870">Roof panel slope length: 508.0 mm; pitch angle: 36.2°.</text>
<text class="note" x="680" y="895">Overhangs: 20 mm front/rear; 30 mm each side.</text>
</svg>