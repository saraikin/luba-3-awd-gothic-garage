<line class="dim" x1="80" y1="655" x2="498.00000000000006" y2="655"/><text class="small" x="289.0" y="647" text-anchor="middle">760 mm</text>
<line class="dim" x1="543.0" y1="351.5" x2="543.0" y2="610"/><text class="small" x="555.0" y="480.75" text-anchor="start" dominant-baseline="middle">470 mm</text>
<text class="small" x="289.0" y="387.5" text-anchor="middle">minimum 650×450</text>
<text class="txt" x="590" y="120">Side view</text>
<rect class="solid" x="590" y="351.5" width="577.5" height="258.5"/>
<rect class="dash" x="645.0" y="362.5" width="467.50000000000006" height="247.50000000000003"/>
<line class="dim" x1="590" y1="655" x2="1167.5" y2="655"/><text class="small" x="878.75" y="647" text-anchor="middle">1050 mm</text>
<line class="dim" x1="1212.5" y1="351.5" x2="1212.5" y2="610"/><text class="small" x="1224.5" y="480.75" text-anchor="start" dominant-baseline="middle">470 mm</text>
<text class="small" x="878.75" y="387.5" text-anchor="middle">minimum 850×450</text>
<text class="txt" x="80" y="725">Top view / footprint</text>
<rect class="solid" x="80" y="760" width="577.5" height="418.00000000000006"/>
<rect class="dash" x="134.99999999999997" y="790.25" width="467.50000000000006" height="357.50000000000006"/>
<line class="dim" x1="80" y1="1223.0" x2="657.5" y2="1223.0"/><text class="small" x="368.75" y="1215.0" text-anchor="middle">1050 mm</text>
<line class="dim" x1="702.5" y1="760" x2="702.5" y2="1178.0"/><text class="small" x="714.5" y="969.0" text-anchor="start" dominant-baseline="middle">760 mm</text>
<text class="small" x="368.75" y="820.25" text-anchor="middle">minimum 850×650</text>
